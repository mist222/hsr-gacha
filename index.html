<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星穹铁道 · 跃迁系统</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg-dark:#0a0e27;--bg-mid:#121a3a;--gold:#f0c060;--gold-glow:#ffd700;
  --purple:#9b6dff;--purple-glow:#b388ff;--cyan:#00e5ff;--cyan-glow:#4ddbff;
  --pink:#ff6b9d;--red:#ff4757;--green:#2ed573;--blue:#3742fa;
  --text:#e8eaf6;--text-dim:#8892b0;--card-bg:rgba(18,26,58,0.85);
  --border:rgba(155,109,255,0.3);
}
html,body{height:100%;overflow-x:hidden}
body{background:var(--bg-dark);color:var(--text);font-family:'Segoe UI','Microsoft YaHei',sans-serif;min-height:100vh;position:relative}
#starfield{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
.star{position:absolute;background:#fff;border-radius:50%;animation:twinkle var(--dur,3s) ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.5)}50%{opacity:1;transform:scale(1.2)}}
.nebula{position:fixed;border-radius:50%;filter:blur(80px);opacity:.15;z-index:0;pointer-events:none;animation:drift 30s ease-in-out infinite}
.nebula.n1{width:600px;height:600px;background:var(--purple);top:-100px;left:-100px}
.nebula.n2{width:500px;height:500px;background:var(--cyan);bottom:-50px;right:-50px;animation-delay:-10s}
.nebula.n3{width:400px;height:400px;background:var(--pink);top:40%;left:30%;animation-delay:-20s}
@keyframes drift{0%,100%{transform:translate(0,0)}33%{transform:translate(50px,-30px)}66%{transform:translate(-30px,50px)}}
#app{position:relative;z-index:1;max-width:1200px;margin:0 auto;padding:20px}
.header{display:flex;justify-content:space-between;align-items:center;padding:15px 25px;background:var(--card-bg);border:1px solid var(--border);border-radius:16px;backdrop-filter:blur(10px);margin-bottom:20px}
.title-area h1{font-size:1.8em;background:linear-gradient(135deg,var(--gold),var(--purple),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-weight:800;letter-spacing:2px}
.title-area .subtitle{color:var(--text-dim);font-size:.85em;margin-top:2px}
.stats-area{display:flex;gap:15px}
.stat-box{text-align:center;padding:8px 16px;background:rgba(0,0,0,.3);border-radius:12px;border:1px solid var(--border)}
.stat-box .num{font-size:1.5em;font-weight:700}
.stat-box .label{font-size:.7em;color:var(--text-dim);margin-top:2px}
.stat-box.gold .num{color:var(--gold)}
.stat-box.purple .num{color:var(--purple)}
.stat-box.cyan .num{color:var(--cyan)}
.pool-switcher{display:flex;gap:8px;margin-bottom:12px}
.pool-tab{padding:8px 24px;border:1px solid var(--border);background:var(--card-bg);color:var(--text-dim);border-radius:12px;cursor:pointer;font-size:.9em;font-weight:600;transition:all .3s}
.pool-tab.active{background:linear-gradient(90deg,var(--purple),var(--cyan));border-color:transparent;color:#fff;box-shadow:0 0 15px rgba(155,109,255,.3)}
.pool-tab:hover:not(.active){border-color:var(--purple);color:var(--text)}
.banner{position:relative;background:linear-gradient(135deg,rgba(18,26,58,.9),rgba(10,14,39,.95));border:2px solid var(--border);border-radius:20px;padding:30px;text-align:center;overflow:hidden;margin-bottom:20px}
.banner::before{content:'';position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(45deg,transparent 40%,rgba(155,109,255,.08) 50%,transparent 60%);animation:shimmer 4s ease-in-out infinite}
@keyframes shimmer{0%,100%{transform:translateX(-100%)}50%{transform:translateX(100%)}}
.banner-featured{position:relative;z-index:1}
.banner-label{display:inline-block;padding:4px 16px;background:linear-gradient(90deg,var(--purple),var(--cyan));border-radius:20px;font-size:.8em;font-weight:600;margin-bottom:12px}
.banner-title{font-size:1.6em;font-weight:700;margin-bottom:8px}
.banner-desc{color:var(--text-dim);font-size:.9em;margin-bottom:20px}
.pity-info{display:flex;justify-content:center;gap:20px;margin-top:15px;font-size:.85em;flex-wrap:wrap}
.pity-bar{display:flex;align-items:center;gap:8px}
.pity-bar .bar{width:120px;height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden}
.pity-bar .fill{height:100%;border-radius:3px;transition:width .5s ease}
.pity-bar.gold .fill{background:linear-gradient(90deg,var(--gold),var(--gold-glow))}
.pity-bar.purple .fill{background:linear-gradient(90deg,var(--purple),var(--purple-glow))}
.pull-buttons{display:flex;justify-content:center;gap:20px;margin-bottom:20px}
.pull-btn{padding:14px 40px;font-size:1.1em;font-weight:700;border:none;border-radius:14px;cursor:pointer;transition:all .3s ease;position:relative;overflow:hidden;font-family:inherit}
.pull-btn.single{background:linear-gradient(135deg,rgba(0,229,255,.2),rgba(55,66,250,.3));border:1px solid var(--cyan);color:var(--cyan)}
.pull-btn.ten{background:linear-gradient(135deg,rgba(240,192,96,.2),rgba(255,107,157,.3));border:1px solid var(--gold);color:var(--gold)}
.pull-btn:hover{transform:translateY(-3px);box-shadow:0 8px 30px rgba(155,109,255,.4)}
.pull-btn:active{transform:translateY(0)}
.pull-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
.pull-btn .ticket-icon{font-size:1.2em;margin-right:6px}
#gacha-overlay{position:fixed;top:0;left:0;width:100%;height:100%;z-index:100;display:none;justify-content:center;align-items:center;background:rgba(5,8,20,.98);backdrop-filter:blur(10px);overflow:hidden}
#gacha-overlay.active{display:flex}
.gacha-stage{position:relative;width:100%;height:100%;display:flex;justify-content:center;align-items:center;perspective:1000px}
/* === 星轨穿梭 === */.star-track{position:absolute;top:0;left:0;width:100%;height:100%;z-index:5;opacity:0;pointer-events:none;overflow:hidden}.star-track.active{animation:trackFade 1.5s ease-out forwards}@keyframes trackFade{0%{opacity:0}20%{opacity:1}80%{opacity:1}100%{opacity:0}}.star-track .track-line{position:absolute;top:50%;left:-30%;width:160%;height:2px;border-radius:2px;transform-origin:left center;animation:trackDash 1.5s ease-out forwards}@keyframes trackDash{0%{opacity:0;transform:translateY(-50%) scaleX(0)}30%{opacity:.8}100%{opacity:0;transform:translateY(-50%) scaleX(1)}}.star-track .track-dot{position:absolute;border-radius:50%;pointer-events:none;animation:trackDotFly 1.2s linear forwards}@keyframes trackDotFly{0%{opacity:0;transform:translate(0,0) scale(.3)}15%{opacity:1}85%{opacity:1}100%{opacity:0;transform:translate(var(--dx,100vw),var(--dy,0)) scale(1.5)}}/* === 光爆层 === */.warp-flash{position:absolute;top:50%;left:50%;width:0;height:0;border-radius:50%;z-index:6;opacity:0;pointer-events:none;transform:translate(-50%,-50%)}.warp-flash.active{animation:warpFlash .8s ease-out forwards}@keyframes warpFlash{0%{width:0;height:0;opacity:0}30%{width:100px;height:100px;opacity:1}60%{width:500px;height:500px;opacity:.6}100%{width:900px;height:900px;opacity:0}}.warp-flash.gold{background:radial-gradient(circle,#fff 0%,#ffd700 30%,rgba(255,215,0,.3) 60%,transparent 80%)}.warp-flash.purple{background:radial-gradient(circle,#fff 0%,#9b6dff 30%,rgba(155,109,255,.3) 60%,transparent 80%)}.warp-flash.blue{background:radial-gradient(circle,#fff 0%,#00e5ff 30%,rgba(0,229,255,.2) 60%,transparent 80%)}/* === 星空裂开 === */.warp-burst{position:absolute;top:50%;left:50%;width:0;height:0;z-index:4;opacity:0;pointer-events:none;transform:translate(-50%,-50%) rotate(0deg)}.warp-burst.active{animation:warpCrack 1s ease-out forwards}@keyframes warpCrack{0%{opacity:0;transform:translate(-50%,-50%) scale(0) rotate(0deg)}40%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(15deg)}100%{opacity:0;transform:translate(-50%,-50%) scale(2.5) rotate(45deg)}}.warp-burst .crack-ray{position:absolute;top:50%;left:50%;width:4px;height:600px;margin-left:-2px;margin-top:-300px;border-radius:2px;transform-origin:center center}/* === 流星层 === */.meteor-layer{position:absolute;top:0;left:0;width:100%;height:100%;z-index:5;pointer-events:none;overflow:hidden}.meteor-layer .meteor{position:absolute;border-radius:50%;animation:meteorFall 1.2s ease-in forwards}@keyframes meteorFall{0%{opacity:0;transform:translate(0,0) scale(.5)}10%{opacity:1}80%{opacity:1}100%{opacity:0;transform:translate(var(--mx,0),var(--my,100vh)) scale(1.2)}}.meteor-layer .meteor-trail{position:absolute;border-radius:50%;opacity:.5;animation:meteorTrail 1s ease-out forwards}@keyframes meteorTrail{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(0)}}/* === 流星落地光圈 === */.meteor-impact{position:absolute;width:0;height:0;border-radius:50%;z-index:5;opacity:0;pointer-events:none;animation:impactRing .6s ease-out forwards}@keyframes impactRing{0%{width:0;height:0;opacity:1}50%{width:80px;height:80px;opacity:.8}100%{width:160px;height:160px;opacity:0}}
/* === 星轨票输入 === */
.ticket-edit{font-size:.55em;background:rgba(0,229,255,.2);border:1px solid var(--cyan);color:var(--cyan);border-radius:6px;padding:1px 6px;cursor:pointer;font-family:inherit;margin-left:6px;transition:all .3s}
.ticket-edit:hover{background:rgba(0,229,255,.4);color:#fff}
/* === 品质揭示光柱 === */
.light-pillar{position:absolute;width:10px;height:0;z-index:3;opacity:0;border-radius:5px;top:50%;left:50%;transform:translateX(-50%)}
.light-pillar.active{animation:pillarRise 1s ease-out forwards}
@keyframes pillarRise{0%{height:0;opacity:0}15%{height:200px;opacity:1}40%{height:400px;opacity:.95}70%{height:550px;opacity:.7}100%{height:650px;opacity:0}}
.light-pillar.gold{background:linear-gradient(180deg,transparent 5%,#ffd700 20%,#fff 50%,#ffd700 80%,transparent 95%);box-shadow:0 0 80px 20px rgba(255,215,0,.7),0 0 160px 40px rgba(255,215,0,.25)}
.light-pillar.purple{background:linear-gradient(180deg,transparent 5%,#9b6dff 20%,#fff 50%,#9b6dff 80%,transparent 95%);box-shadow:0 0 50px 12px rgba(155,109,255,.5),0 0 100px 25px rgba(155,109,255,.15)}
.light-pillar.blue{background:linear-gradient(180deg,transparent 5%,#00e5ff 20%,#fff 50%,#00e5ff 80%,transparent 95%);box-shadow:0 0 30px 8px rgba(0,229,255,.35)}
/* === 金色光线放射 === */
.gold-rays{position:absolute;width:100%;height:100%;z-index:2;opacity:0;pointer-events:none;top:0;left:0}
.gold-rays.active{animation:raysExpand 1.2s ease-out forwards}
@keyframes raysExpand{0%{opacity:0;transform:scale(0) rotate(0deg)}25%{opacity:1;transform:scale(.4) rotate(10deg)}55%{opacity:.9;transform:scale(1) rotate(25deg)}100%{opacity:0;transform:scale(1.8) rotate(50deg)}}
.gold-rays .ray{position:absolute;top:50%;left:50%;width:4px;height:700px;background:linear-gradient(180deg,transparent,rgba(255,215,0,.7),rgba(255,215,0,.2),transparent);transform-origin:center top;border-radius:2px;margin-left:-2px;margin-top:-350px}
/* === 屏幕震动 === */
.screen-shake{animation:screenShake .5s ease-out}
@keyframes screenShake{0%{transform:translate(0,0)}12%{transform:translate(-10px,5px)}25%{transform:translate(8px,-4px)}37%{transform:translate(-6px,3px)}50%{transform:translate(5px,-2px)}62%{transform:translate(-4px,2px)}75%{transform:translate(3px,-1px)}87%{transform:translate(-1px,0px)}100%{transform:translate(0,0)}}
/* === 金色星空背景 === */
.gold-starfield{position:absolute;top:0;left:0;width:100%;height:100%;z-index:1;opacity:0;pointer-events:none;background:radial-gradient(circle at 50% 45%,rgba(255,215,0,.2),rgba(255,180,0,.05) 40%,transparent 70%);transition:opacity .6s}
.gold-starfield.active{opacity:1}
.gold-starfield .gs-star{position:absolute;width:2px;height:2px;background:#ffd700;border-radius:50%;animation:gsTwinkle 1.8s ease-in-out infinite}
@keyframes gsTwinkle{0%,100%{opacity:.15;transform:scale(.4)}50%{opacity:1;transform:scale(1.8);box-shadow:0 0 8px #ffd700}}
/* === 品质揭示圆环 === */
.rarity-burst{position:absolute;width:0;height:0;border-radius:50%;z-index:4;opacity:0;top:50%;left:50%;transform:translate(-50%,-50%)}
.rarity-burst.active{animation:burstExpand .8s ease-out forwards}
@keyframes burstExpand{0%{width:0;height:0;opacity:1}25%{width:300px;height:300px;opacity:.9}55%{width:550px;height:550px;opacity:.5}100%{width:900px;height:900px;opacity:0}}
.rarity-burst.gold{background:radial-gradient(circle,rgba(255,215,0,.45) 0%,rgba(255,215,0,.1) 35%,transparent 65%);border:4px solid rgba(255,215,0,.5)}
.rarity-burst.purple{background:radial-gradient(circle,rgba(155,109,255,.35) 0%,rgba(155,109,255,.06) 40%,transparent 70%);border:3px solid rgba(155,109,255,.4)}
.rarity-burst.blue{background:radial-gradient(circle,rgba(0,229,255,.2) 0%,rgba(0,229,255,.05) 40%,transparent 70%);border:2px solid rgba(0,229,255,.3)}
/* === 第二层圆环（仅五星） === */
.rarity-burst-2{position:absolute;width:0;height:0;border-radius:50%;z-index:4;opacity:0;top:50%;left:50%;transform:translate(-50%,-50%);border:2px solid rgba(255,215,0,.25)}
.rarity-burst-2.active{animation:burstExpand2 1s ease-out .2s forwards}
@keyframes burstExpand2{0%{width:0;height:0;opacity:0}40%{width:350px;height:350px;opacity:.5}100%{width:1000px;height:1000px;opacity:0}}
/* === 背景颜色闪烁 === */
.flash-overlay{position:absolute;top:0;left:0;width:100%;height:100%;z-index:1;opacity:0;pointer-events:none}
.flash-overlay.flash-gold{animation:flashGold .6s ease-out forwards}
.flash-overlay.flash-purple{animation:flashPurple .5s ease-out forwards}
.flash-overlay.flash-blue{animation:flashBlue .4s ease-out forwards}
@keyframes flashGold{0%{opacity:0}25%{opacity:.35;background:radial-gradient(circle,rgba(255,215,0,.45),transparent 55%)}100%{opacity:0}}
@keyframes flashPurple{0%{opacity:0}25%{opacity:.25;background:radial-gradient(circle,rgba(155,109,255,.4),transparent 60%)}100%{opacity:0}}
@keyframes flashBlue{0%{opacity:0}25%{opacity:.15;background:radial-gradient(circle,rgba(0,229,255,.3),transparent 60%)}100%{opacity:0}}
/* === 粒子 === */
.particle-burst{position:absolute;pointer-events:none;z-index:6}
.particle{position:absolute;width:6px;height:6px;border-radius:50%;animation:particleFly 1.6s ease-out forwards}
@keyframes particleFly{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--tx),var(--ty)) scale(0);opacity:0}}
/* === 角色展示卡 === */
.reveal-card{position:absolute;top:50%;left:50%;display:none;flex-direction:column;align-items:center;z-index:20;transform:translate(-50%,-50%) scale(1)}
.reveal-card.active{display:flex;animation:revealUp 1s cubic-bezier(.22,.61,.36,1) forwards}
@keyframes revealUp{0%{transform:translate(-50%,-50%) translateY(100px) scale(.5);opacity:0}50%{transform:translate(-50%,-50%) translateY(-15px) scale(1.08);opacity:1}75%{transform:translate(-50%,-50%) translateY(5px) scale(.98);opacity:1}100%{transform:translate(-50%,-50%) translateY(0) scale(1);opacity:1}}
.reveal-card .char-portrait{width:300px;height:440px;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:25px;position:relative;overflow:hidden;border:3px solid;box-shadow:0 0 80px rgba(0,0,0,.5)}
.reveal-card.five-star .char-portrait{border-color:var(--gold);box-shadow:0 0 120px rgba(255,215,0,.4),0 0 60px rgba(255,215,0,.2),inset 0 0 40px rgba(255,215,0,.1);animation:goldPulse 2s ease-in-out infinite}
@keyframes goldPulse{0%,100%{box-shadow:0 0 100px rgba(255,215,0,.3),0 0 50px rgba(255,215,0,.2),inset 0 0 40px rgba(255,215,0,.08)}50%{box-shadow:0 0 160px rgba(255,215,0,.5),0 0 80px rgba(255,215,0,.3),inset 0 0 60px rgba(255,215,0,.15)}}
.reveal-card.four-star .char-portrait{border-color:var(--purple);box-shadow:0 0 70px rgba(155,109,255,.3),inset 0 0 30px rgba(155,109,255,.08)}
.reveal-card.three-star .char-portrait{border-color:var(--cyan)}
.char-portrait .glow-bg{position:absolute;top:0;left:0;width:100%;height:100%;opacity:.3;animation:glowPulse 2s ease-in-out infinite}
@keyframes glowPulse{0%,100%{opacity:.2}50%{opacity:.5}}
.char-portrait .element-icon{position:absolute;top:18px;right:18px;font-size:1.5em;z-index:2}
.char-portrait .path-icon{position:absolute;top:18px;left:18px;font-size:1.2em;z-index:2;opacity:.8}
.char-portrait .char-avatar{width:200px;height:280px;border-radius:12px;display:flex;align-items:flex-end;justify-content:center;font-size:3em;margin-bottom:14px;z-index:2;position:relative;overflow:hidden;border:2px solid rgba(255,255,255,.2);object-fit:cover;object-position:top center}
.char-portrait .char-avatar img{width:100%;height:100%;object-fit:cover;object-position:top center;border-radius:12px}
.char-portrait .char-avatar .emoji-fallback{font-size:5em;position:absolute;top:40%;left:50%;transform:translate(-50%,-50%)}
.char-portrait .char-name-r{font-size:1.6em;font-weight:700;z-index:2;text-shadow:0 2px 12px rgba(0,0,0,.9)}
.char-portrait .char-info-r{font-size:.8em;color:var(--text-dim);z-index:2;margin-top:4px}
.reveal-card .rarity-stars{margin-top:18px;font-size:1.6em}
.reveal-card .rarity-stars .star{display:inline-block;animation:starPop .4s ease-out forwards;opacity:0}
@keyframes starPop{0%{transform:scale(0) rotate(-360deg);opacity:0}60%{transform:scale(1.3) rotate(10deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
/* === 十连卡片网格 === */
.multi-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;max-width:850px;padding:20px;display:none;z-index:10}
.multi-grid.active{display:grid;animation:gridFadeIn .5s ease-out}
@keyframes gridFadeIn{from{opacity:0;transform:scale(.9) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
/* 卡片：先显示背面，翻转时显示正面 */
.multi-card{aspect-ratio:3/4;border-radius:14px;position:relative;cursor:pointer;overflow:hidden;transform-style:preserve-3d;opacity:0;transition:transform .2s}
.multi-card.face-down{opacity:1;animation:cardAppear .4s ease-out forwards}
@keyframes cardAppear{0%{opacity:0;transform:scale(.5) translateY(20px)}100%{opacity:1;transform:scale(1) translateY(0)}}
.multi-card.flipping{animation:cardFlip .8s cubic-bezier(.22,.61,.36,1) forwards}
@keyframes cardFlip{0%{transform:rotateY(0) scale(1)}40%{transform:rotateY(90deg) scale(.85)}50%{transform:rotateY(90deg) scale(.85)}100%{transform:rotateY(0) scale(1)}}
.multi-card.flipped .card-back{display:none}
.multi-card.flipped .card-front{display:flex}
.multi-card:hover{transform:scale(1.08) translateY(-4px);z-index:5}
/* 卡片背面 */
.card-back{position:absolute;inset:0;border-radius:14px;display:none;align-items:center;justify-content:center;background:linear-gradient(135deg,#1a1f3a 0%,#0d1124 50%,#1a1f3a 100%);border:2px solid rgba(100,120,200,.2)}
.card-back::after{content:'✦';font-size:2.5em;color:rgba(100,120,200,.3);text-shadow:0 0 20px rgba(100,120,200,.2)}
/* 卡片正面 */
.card-front{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px;border-radius:14px;border:2px solid;height:100%;width:100%;background:var(--card-bg);position:absolute;inset:0}
.multi-card.five-star .card-front{border-color:var(--gold);box-shadow:0 0 25px rgba(240,192,96,.5)}
.multi-card.four-star .card-front{border-color:var(--purple);box-shadow:0 0 18px rgba(155,109,255,.4)}
.multi-card.three-star .card-front{border-color:var(--cyan)}
.card-front .mc-avatar{font-size:2em;width:100%;aspect-ratio:3/4;max-width:90px;margin:0 auto 6px;display:flex;align-items:flex-end;justify-content:center;border-radius:8px;overflow:hidden;position:relative;z-index:1}
.card-front .mc-avatar img{width:100%;height:100%;object-fit:cover;object-position:top center;border-radius:8px}
.card-front .mc-avatar .emoji-fallback{font-size:2.5em;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}
.card-front .mc-name{font-size:.75em;font-weight:600;text-align:center;text-shadow:0 1px 4px rgba(0,0,0,.8);position:relative;z-index:1}
.card-front .mc-elem{position:absolute;top:4px;right:4px;font-size:.8em;z-index:2}
.card-front .mc-stars{font-size:.6em;margin-top:2px;position:relative;z-index:1}
/* 五星卡片流光 */
.multi-card.five-star .card-front::after{content:'';position:absolute;inset:0;background:linear-gradient(135deg,transparent 40%,rgba(255,215,0,.2) 50%,transparent 60%);animation:cardShimmer 2s ease-in-out infinite;pointer-events:none;z-index:0}
@keyframes cardShimmer{0%,100%{transform:translateX(-100%)}50%{transform:translateX(100%)}}
.multi-card.five-star .card-front::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 30%,rgba(255,215,0,.15),transparent 70%);pointer-events:none;z-index:0}
/* === 跳过按钮 === */
.skip-btn{position:fixed;bottom:30px;right:30px;padding:10px 24px;background:rgba(0,0,0,.6);border:1px solid var(--border);color:var(--text-dim);border-radius:10px;cursor:pointer;font-size:.9em;z-index:101;display:none;transition:all .3s}

.next-btn{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);padding:12px 32px;background:rgba(155,109,255,.3);border:1px solid var(--purple);color:var(--text);border-radius:10px;cursor:pointer;font-size:1em;z-index:101;display:none;transition:all .3s;animation:nextPulse 1.5s ease-in-out infinite}
.next-btn.active{display:block}

#interaction-panel{position:fixed;top:0;left:0;width:100%;height:100%;z-index:200;display:none;justify-content:center;align-items:center;background:rgba(5,8,20,.92);backdrop-filter:blur(15px)}
#interaction-panel.active{display:flex}
.interaction-stage{width:95%;max-width:750px;background:var(--card-bg);border:2px solid var(--border);border-radius:20px;padding:25px;position:relative;overflow:hidden}
.interaction-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.interaction-header h2{font-size:1.3em}
.close-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer;font-size:1.2em;display:flex;align-items:center;justify-content:center;transition:all .3s;flex-shrink:0}
.close-btn:hover{background:var(--red);border-color:var(--red)}
/* === Q版2D可动立绘舞台 === */
.char-display{height:440px;border-radius:16px;position:relative;overflow:hidden;margin-bottom:15px;cursor:grab;user-select:none;background:radial-gradient(ellipse at 50% 60%,rgba(15,20,50,.6),rgba(5,8,20,.95))}
.char-display:active{cursor:grabbing}
.char-display .display-bg{position:absolute;top:0;left:0;width:100%;height:100%;opacity:.3;pointer-events:none;z-index:0}
.char-display.shake{animation:stageShake .4s ease-out}
@keyframes stageShake{0%,100%{transform:translate(0,0)}20%{transform:translate(-8px,4px)}40%{transform:translate(6px,-3px)}60%{transform:translate(-4px,2px)}80%{transform:translate(3px,-1px)}}
.dialogue-bubble{position:absolute;top:15px;left:50%;transform:translateX(-50%);max-width:80%;padding:12px 20px;background:rgba(255,255,255,.95);color:#222;border-radius:16px;font-size:.9em;line-height:1.5;z-index:10;opacity:0;transition:opacity .3s;pointer-events:none}
.dialogue-bubble.show{opacity:1;animation:bubblePop .3s ease}
@keyframes bubblePop{0%{transform:translateX(-50%) scale(.8)}100%{transform:translateX(-50%) scale(1)}}
.dialogue-bubble::after{content:'';position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);border:8px solid transparent;border-top-color:rgba(255,255,255,.95);border-bottom:0}
.rotate-hint{position:absolute;top:10px;right:10px;font-size:.7em;color:var(--text-dim);opacity:.6;z-index:10;pointer-events:none;background:rgba(0,0,0,.4);padding:3px 10px;border-radius:10px}
/* Q版舞台容器 */
.chibi-stage{position:absolute;top:0;left:0;width:100%;height:100%;display:flex;align-items:flex-end;justify-content:center;z-index:1;perspective:800px;overflow:hidden}
.chibi-aura{position:absolute;top:25%;left:50%;transform:translateX(-50%);width:400px;height:400px;border-radius:50%;opacity:.2;filter:blur(40px);pointer-events:none;animation:auraSpin 8s linear infinite}
@keyframes auraSpin{from{transform:translateX(-50%) rotate(0deg)}to{transform:translateX(-50%) rotate(360deg)}}
.chibi-ground{position:absolute;bottom:25px;left:50%;transform:translateX(-50%);width:240px;height:30px;border-radius:50%;background:radial-gradient(ellipse,rgba(155,109,255,.12),transparent 70%);pointer-events:none}
.chibi-shadow{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);width:120px;height:16px;border-radius:50%;background:rgba(0,0,0,.45);filter:blur(6px);pointer-events:none;animation:shadowBreath 3s ease-in-out infinite}
@keyframes shadowBreath{0%,100%{width:120px;opacity:.45}50%{width:112px;opacity:.38}}
/* === 全身立绘展示系统 === */
.chibi-model{position:relative;width:280px;height:420px;transform-style:preserve-3d;transition:transform .15s ease-out;margin-bottom:30px;z-index:2;cursor:grab}
.chibi-model.dragging{transition:none;cursor:grabbing}
.chibi-model:active{cursor:grabbing}
/* 立绘容器 */
.chibi-portrait-wrap{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:280px;height:420px;transform-origin:bottom center;animation:portraitBreath 3.5s ease-in-out infinite;pointer-events:none}
@keyframes portraitBreath{0%,100%{transform:translateX(-50%) translateY(0) scale(1)}50%{transform:translateX(-50%) translateY(-4px) scale(1.01)}}
.chibi-portrait{width:100%;height:100%;object-fit:contain;object-position:bottom center;pointer-events:none;filter:drop-shadow(0 4px 20px rgba(0,0,0,.5))}
.chibi-portrait.emoji-mode{display:flex;align-items:flex-end;justify-content:center;font-size:8em;object-fit:unset;filter:drop-shadow(0 4px 15px rgba(0,0,0,.4))}
/* 元素光环 */
.chibi-elem-ring{position:absolute;top:35%;left:50%;transform:translate(-50%,-50%);width:300px;height:300px;border-radius:50%;border:2px solid;opacity:.15;pointer-events:none;animation:ringRotate 12s linear infinite}
@keyframes ringRotate{from{transform:translate(-50%,-50%) rotate(0deg)}to{transform:translate(-50%,-50%) rotate(360deg)}}
/* 底部渐变遮罩 */
.chibi-fade-bottom{position:absolute;bottom:0;left:0;width:100%;height:60px;background:linear-gradient(180deg,transparent,rgba(5,8,20,.6));pointer-events:none;z-index:3}
/* 名牌 */
.chibi-nameplate{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);padding:6px 22px;background:rgba(0,0,0,.65);border:1px solid var(--border);border-radius:20px;font-size:.9em;font-weight:600;white-space:nowrap;backdrop-filter:blur(10px);z-index:5;pointer-events:none}
/* 特效层 */
.chibi-fx{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:4;overflow:hidden}
/* === 动作动画类（立绘整体驱动） === */
.chibi-model.act-idle .chibi-portrait-wrap{animation:portraitBreath 3.5s ease-in-out infinite}
.chibi-model.act-greet .chibi-portrait-wrap{animation:greetBounce .6s ease-out}
@keyframes greetBounce{0%{transform:translateX(-50%) translateY(0) scale(1)}30%{transform:translateX(-50%) translateY(-15px) scale(1.02)}60%{transform:translateX(-50%) translateY(-8px) scale(1.01)}100%{transform:translateX(-50%) translateY(0) scale(1)}}
.chibi-model.act-battle .chibi-portrait-wrap{animation:battleLunge .5s ease-out}
@keyframes battleLunge{0%{transform:translateX(-50%) translateX(0) scale(1)}30%{transform:translateX(-50%) translateX(20px) scale(1.03) rotate(3deg)}60%{transform:translateX(-50%) translateX(-10px) scale(1.02) rotate(-2deg)}100%{transform:translateX(-50%) translateX(0) scale(1)}}
.chibi-model.act-skill .chibi-portrait-wrap{animation:skillSurge .8s ease-out}
@keyframes skillSurge{0%{transform:translateX(-50%) translateY(0) scale(1)}30%{transform:translateX(-50%) translateY(-10px) scale(1.05)}60%{transform:translateX(-50%) translateY(-18px) scale(1.08)}100%{transform:translateX(-50%) translateY(-8px) scale(1.04)}}
.chibi-model.act-affinity .chibi-portrait-wrap{animation:affinitySway 1s ease-in-out}
@keyframes affinitySway{0%{transform:translateX(-50%) rotate(0deg) translateY(0)}30%{transform:translateX(-50%) rotate(-5deg) translateY(-10px)}60%{transform:translateX(-50%) rotate(4deg) translateY(-8px)}100%{transform:translateX(-50%) rotate(0deg) translateY(-4px)}}
/* 特效粒子 */
.chibi-spark{position:absolute;width:8px;height:8px;border-radius:50%;animation:sparkFloat 1.5s ease-out forwards;pointer-events:none}
@keyframes sparkFloat{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}
.chibi-slash{position:absolute;top:35%;left:50%;width:0;height:4px;transform:translateX(-50%) rotate(-25deg);border-radius:4px;pointer-events:none;animation:slashExpand .4s ease-out forwards}
@keyframes slashExpand{0%{width:0;opacity:0}40%{width:200px;opacity:1}100%{width:280px;opacity:0}}
.chibi-orb{position:absolute;top:40%;left:50%;width:20px;height:20px;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;animation:orbGrow .8s ease-out forwards}
@keyframes orbGrow{0%{width:10px;height:10px;opacity:.3}50%{width:100px;height:100px;opacity:.8}100%{width:180px;height:180px;opacity:0}}
.chibi-ring{position:absolute;top:45%;left:50%;width:20px;height:20px;border-radius:50%;transform:translate(-50%,-50%);border:3px solid;pointer-events:none;animation:ringPulse .6s ease-out forwards}
@keyframes ringPulse{0%{width:10px;height:10px;opacity:1;border-width:4px}50%{width:150px;height:150px;opacity:.6;border-width:2px}100%{width:260px;height:260px;opacity:0;border-width:1px}}
.chibi-heart{position:absolute;font-size:18px;pointer-events:none;animation:heartFloat 1.8s ease-out forwards}
@keyframes heartFloat{0%{transform:translate(0,0) scale(.5);opacity:1}50%{transform:translate(var(--dx),var(--dy)) scale(1.2);opacity:1}100%{transform:translate(var(--dx),calc(var(--dy) - 40px)) scale(.8);opacity:0}}
.collection-section{background:var(--card-bg);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:20px}
.collection-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;flex-wrap:wrap;gap:10px}
.collection-header h2{font-size:1.2em}
.collection-header .filter-tabs{display:flex;gap:8px;flex-wrap:wrap}
.filter-tab{padding:6px 14px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text-dim);cursor:pointer;font-size:.85em;transition:all .3s}
.filter-tab.active,.filter-tab:hover{background:rgba(155,109,255,.2);color:var(--text);border-color:var(--purple)}
.collection-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.coll-card{aspect-ratio:2/3;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0 0 6px;position:relative;cursor:pointer;transition:all .3s;border:2px solid;overflow:hidden}
.coll-card:hover{transform:scale(1.05);z-index:5}
.coll-card.five-star{border-color:var(--gold)}
.coll-card.four-star{border-color:var(--purple)}
.coll-card.three-star{border-color:var(--cyan)}

.coll-card.locked:hover{transform:none}
.coll-card .cc-avatar{font-size:1.8em;width:100%;flex:1;margin:0 auto;min-height:0;display:flex;align-items:flex-end;justify-content:center;overflow:hidden;position:relative}
.coll-card .cc-avatar img{width:100%;height:100%;object-fit:contain;object-position:bottom center}
  .coll-card .cc-avatar .emoji-fallback{font-size:2.5em;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)}
.coll-card .cc-name{font-size:.7em;text-align:center;font-weight:600;padding:2px 4px;background:linear-gradient(transparent,rgba(0,0,0,.7));width:100%;line-height:1.3;position:relative;z-index:2;flex-shrink:0}
.coll-card .cc-elem{position:absolute;top:3px;right:3px;font-size:.7em}
.coll-card .cc-count{position:absolute;bottom:3px;right:3px;font-size:.65em;background:rgba(0,0,0,.6);padding:1px 5px;border-radius:6px;color:var(--gold)}
.coll-card .cc-new{position:absolute;top:3px;left:3px;font-size:.55em;background:var(--red);padding:1px 5px;border-radius:4px;color:#fff;font-weight:700}
.coll-card .cc-costume{position:absolute;bottom:3px;left:3px;font-size:.5em;background:rgba(0,229,255,.3);padding:1px 5px;border-radius:4px;color:var(--cyan-glow);font-weight:600}
.costume-bar{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:15px}
.path-icon-img{width:1.2em;height:1.2em;object-fit:contain;vertical-align:middle;display:inline}
.cc-elem .path-icon-img{width:14px;height:14px}
.mc-elem .path-icon-img{width:14px;height:14px}
.char-portrait .element-icon .path-icon-img{width:24px;height:24px}
.char-portrait .path-icon .path-icon-img{width:20px;height:20px}
.reveal-info .path-icon-img{width:14px;height:14px}
.costume-btn{padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:rgba(0,0,0,.3);color:var(--text-dim);cursor:pointer;font-size:.8em;transition:all .3s;font-family:inherit}
.costume-btn:hover{background:rgba(155,109,255,.2);border-color:var(--purple);color:var(--text)}
.costume-btn.active{background:linear-gradient(90deg,var(--purple),var(--cyan));border-color:transparent;color:#fff;font-weight:600}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);padding:12px 30px;background:rgba(18,26,58,.95);border:1px solid var(--purple);border-radius:12px;color:var(--text);font-size:.9em;z-index:300;opacity:0;transition:all .4s ease}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:768px){.header{flex-direction:column;gap:12px}.stats-area{flex-wrap:wrap;justify-content:center}.pull-buttons{flex-direction:column;align-items:center}.multi-grid{grid-template-columns:repeat(3,1fr)}.action-buttons{grid-template-columns:repeat(2,1fr)}.collection-grid{grid-template-columns:repeat(auto-fill,minmax(80px,1fr))}.reveal-card .char-portrait{width:220px;height:300px}}
::-webkit-scrollbar{width:8px}

</style>

// 生成角色头像HTML（优先使用立绘图片，加载失败时fallback到emoji）
function getAvatarHTML(char, sizeClass){
  var img = CHARACTER_IMAGES[char.id];
  if(img){
    return '<img src="' + img + '" alt="' + char.name + '" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'" /><span class="emoji-fallback" style="display:none">' + char.avatar + '</span>';
  }
  return char.avatar;
}

// ============================================================
//  光锥/角色通用辅助函数
// ============================================================
function isLightCone(item){
  return item && item.img && !item.dialogues && !item.avatar;
}

function getItemColor(item){
  if(isLightCone(item)){
    var path = PATHS[item.path];
    if(path){
      if(item.path === 'destruction') return '#ff4444';
      if(item.path === 'hunt') return '#00bfff';
      if(item.path === 'erudition') return '#ff8c00';
      if(item.path === 'harmony') return '#ffd700';
      if(item.path === 'nihility') return '#9370db';
      if(item.path === 'preservation') return '#4682b4';
      if(item.path === 'abundance') return '#00ff7f';
      if(item.path === 'remembrance' || item.path === 'joy') return '#00ced1';
    }
    return '#888';
  }
  return item.color || '#888';
}

function getItemAvatarHTML(item){
  if(isLightCone(item)){
    return '<img src="' + item.img + '" alt="' + item.name + '" style="width:100%;height:100%;object-fit:contain;border-radius:8px" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'" /><span class="emoji-fallback" style="display:none;align-items:center;justify-content:center;width:100%;height:100%;font-size:2em"> cards </span>';
  }
  return getAvatarHTML(item);
}

function getItemName(item){
  return item.name;
}

function getItemPath(item){
  return PATHS[item.path] || {name:'未知',icon:'?',img:''};
}

function getItemElement(item){
  if(isLightCone(item)) return null;
  return ELEMENTS[item.element] || null;
}

function getItemRarityStars(rarity){
  var s = '';
  for(var i = 0; i < rarity; i++) s += '\u2B50';
  return s;
}

// 反向映射：变体id -> 父角色id
var VARIANT_TO_MAIN = {};
for(var mainId in COSTUME_GROUPS){
  COSTUME_GROUPS[mainId].forms.forEach(function(fid){
    VARIANT_TO_MAIN[fid] = mainId;
  });
}
// 标记哪些角色id是变体（在图鉴/UP选择器中隐藏）
var VARIANTS = {};
for(var mainId in COSTUME_GROUPS){
  COSTUME_GROUPS[mainId].forms.slice(1).forEach(function(fid){
    VARIANTS[fid] = mainId;
  });
}

// 抽到角色时，返回应该存入collection的id（变体归入父角色）
function resolveCollectId(charId){
  return VARIANT_TO_MAIN[charId] || charId;
}

// 获取互动面板当前选中的时装角色
function getActiveChar(mainId){
  var char = CHARACTERS.find(function(c){return c.id === mainId});
  if(!char) return null;
  // 检查是否有时装组
  for(var groupId in COSTUME_GROUPS){
    var group = COSTUME_GROUPS[groupId];
    if(group.forms.indexOf(mainId) >= 0 || group.main === mainId){
      var activeForm = group.forms[State.activeCostumes ? (State.activeCostumes[groupId] || 0) : 0];
      var activeChar = CHARACTERS.find(function(c){return c.id === activeForm});
      return activeChar || char;
    }
  }
  return char;
}

// 获取已解锁的时装列表
function getUnlockedForms(groupId){
  var group = COSTUME_GROUPS[groupId];
  if(!group) return [];
  return group.forms.filter(function(fid){
    var collectId = resolveCollectId(fid);
    return State.collection[collectId] && State.collection[collectId].unlockedForms && State.collection[collectId].unlockedForms[fid];
  });
}

// 渲染时装切换栏
function renderCostumeBar(charId){
  var bar = document.getElementById('costume-bar');
  if(!bar) return;
  bar.innerHTML = '';
  // 查找该角色所属的时装组
  var groupId = null;
  for(var gid in COSTUME_GROUPS){
    if(COSTUME_GROUPS[gid].forms.indexOf(charId) >= 0){
      groupId = gid;
      break;
    }
  }
  if(!groupId){
    bar.style.display = 'none';
    return;
  }
  var group = COSTUME_GROUPS[groupId];
  var collectId = resolveCollectId(charId);
  var unlocked = State.collection[collectId] && State.collection[collectId].unlockedForms || {};
  var hasMultiple = group.forms.filter(function(fid){return unlocked[fid]}).length > 1;
  if(!hasMultiple){
    bar.style.display = 'none';
    return;
  }
  bar.style.display = 'flex';
  var activeIdx = (State.activeCostumes && State.activeCostumes[groupId]) || 0;
  group.forms.forEach(function(fid, idx){
    if(!unlocked[fid]) return;
    var btn = document.createElement('button');
    btn.className = 'costume-btn' + (idx === activeIdx ? ' active' : '');
    btn.textContent = group.labels[idx] || CHARACTERS.find(function(c){return c.id===fid}).name;
    btn.onclick = function(){
      if(!State.activeCostumes) State.activeCostumes = {};
      State.activeCostumes[groupId] = idx;
      openInteraction(charId);
    };
    bar.appendChild(btn);
  });
}

// ============================================================
//  抽卡核心逻辑
// ============================================================
function getRarityRoll(){
  var rate5 = 0.006;
  if(State.pity5 >= 89) rate5 = 1;
  if(Math.random() < rate5) return 5;
  var rate4 = 0.051;
  if(State.pity4 >= 9) rate4 = 1;
  if(Math.random() < rate4) return 4;
  return 3;
}

function pickItem(rarity){
  var pool;
  var isConePool = (State.poolType === 'cone');
  var featuredId = isConePool ? State.featuredConeId : State.featuredId;

  if(rarity === 5){
    // 5星：角色池出角色，光锥池出光锥
    var dataSource = isConePool ? LIGHT_CONES : CHARACTERS;
    if(State.guaranteed5 || Math.random() < 0.5){
      var featured = dataSource.find(function(c){return c.id === featuredId});
      if(featured) return featured;
    }
    // 歪池：从用户选择的7个五星角色中随机选一个
    var offPoolIds = State.offPoolIds || [];
    if(!isConePool && offPoolIds.length > 0){
      pool = dataSource.filter(function(c){return c.rarity === 5 && offPoolIds.indexOf(c.id) >= 0});
      if(pool.length > 0){
        var pick = pool[Math.floor(Math.random() * pool.length)];
        State.guaranteed5 = true;
        return pick;
      }
    }
    pool = dataSource.filter(function(c){return c.rarity === 5 && c.id !== featuredId});
    var pick = pool[Math.floor(Math.random() * pool.length)];
    State.guaranteed5 = true;
    return pick;
  } else if(rarity === 4){
    if(isConePool){
      // 光锥池4星：出4星光锥
      pool = LIGHT_CONES.filter(function(c){return c.rarity === 4});
    } else {
      var up4Ids = State.featured4Ids || [];
      // 四星大保底：上次四星非UP → 本次必出UP四星角色
      if(State.guaranteed4 && up4Ids.length > 0){
        var up4Chars = CHARACTERS.filter(function(c){return c.rarity === 4 && up4Ids.indexOf(c.id) >= 0 && !VARIANTS[c.id]});
        if(up4Chars.length > 0){
          return up4Chars[Math.floor(Math.random() * up4Chars.length)];
        }
      }
      // UP四星占四星总概率50%（含角色+光锥），3个UP均分
      if(up4Ids.length > 0 && Math.random() < 0.5){
        var up4Chars2 = CHARACTERS.filter(function(c){return c.rarity === 4 && up4Ids.indexOf(c.id) >= 0 && !VARIANTS[c.id]});
        if(up4Chars2.length > 0){
          return up4Chars2[Math.floor(Math.random() * up4Chars2.length)];
        }
      }
      // 非UP四星：50%出四星角色，50%出四星光锥
      if(Math.random() < 0.5){
        pool = CHARACTERS.filter(function(c){return c.rarity === 4 && up4Ids.indexOf(c.id) < 0 && !VARIANTS[c.id]});
      } else {
        pool = LIGHT_CONES.filter(function(c){return c.rarity === 4});
      }
    }
    if(pool.length === 0){
      pool = CHARACTERS.filter(function(c){return c.rarity === 4 && !VARIANTS[c.id]});
    }
    return pool[Math.floor(Math.random() * pool.length)];
  } else {
    // 3星：两个池子都只出3星光锥（官方机制：3星物品仅包含光锥）
    pool = LIGHT_CONES.filter(function(c){return c.rarity === 3});
    return pool[Math.floor(Math.random() * pool.length)];
  }
}

function doPull(count){
  if(State.isAnimating) return;
  if(State.tickets !== Infinity && State.tickets < count){
    showToast('星轨票不足！当前剩余 ' + State.tickets.toLocaleString() + ' 张');
    return;
  }
  State.isAnimating = true;
  if(State.tickets !== Infinity) State.tickets -= count;
  updateStats();

  var results = [];
  for(var i=0; i<count; i++){
    var rarity = getRarityRoll();
    var char = pickItem(rarity);
    var actualRarity = char.rarity;

    if(actualRarity === 5){
      State.pity5 = 0;
      State.fiveStarCount++;
      var featId = (State.poolType === 'cone') ? State.featuredConeId : State.featuredId;
      if(char.id === featId) State.guaranteed5 = false;
    } else {
      State.pity5++;
    }
    if(actualRarity === 4){
      State.pity4 = 0;
      State.fourStarCount++;
      // 四星大保底：非UP四星（角色或光锥）→ 下次必出UP四星角色
      var up4Ids = State.featured4Ids || [];
      var isUp4Char = char.dialogues && char.avatar && up4Ids.indexOf(char.id) >= 0;
      if(isUp4Char){
        State.guaranteed4 = false;
      } else {
        State.guaranteed4 = true;
      }
    } else if(actualRarity === 5){
      State.pity4 = 0;
    } else {
      State.pity4++;
    }

    var isCone = (char.path && char.img && !char.dialogues);
    var collectId = isCone ? char.id : resolveCollectId(char.id);
    var coll = isCone ? State.coneCollection : State.collection;
    if(!coll[collectId]){
      coll[collectId] = { count: 0, isNew: true, affinity: 0, unlockedForms: {} };
    } else {
      coll[collectId].isNew = false;
    }
    coll[collectId].count++;
    if(!isCone){
      if(!coll[collectId].unlockedForms) coll[collectId].unlockedForms = {};
      coll[collectId].unlockedForms[char.id] = true;
    }

    results.push({ char: char, rarity: actualRarity, collectId: collectId });
    State.totalPulls++;
    // 获得未熄的星芒（官方规则）
    var obtainCount = coll[collectId].count; // 当前获取次数（已++）
    if(isCone){
      // 4星光锥：每张+8星芒
      if(actualRarity === 4) State.starlight += 8;
    } else {
      // 角色：仅重复获取时获得星芒
      if(obtainCount >= 2){
        if(actualRarity === 5){
          // 5星角色：第2-7次+40，第8次起+100
          State.starlight += (obtainCount <= 7) ? 40 : 100;
        } else if(actualRarity === 4){
          // 4星角色：第2-7次+8，第8次起+20
          State.starlight += (obtainCount <= 7) ? 8 : 20;
        }
      }
    }
  }

  updateStats();
  playGachaAnimation(results);
}

// === 星轨穿梭：从远处延伸星轨，光点沿星轨飞过 ===
function spawnStarTrack(isGold, dotCount){
  var track = document.getElementById('star-track');
  if(!track) return;
  track.innerHTML = '';
  track.className = 'star-track';
  void track.offsetWidth;
  track.classList.add('active');

  var color = isGold ? '#ffd700' : '#00e5ff';
  var lineCount = isGold ? 14 : 10;
  var trackLines = [];

  // 生成多条星轨线
  for(var i = 0; i < lineCount; i++){
    var line = document.createElement('div');
    line.className = 'track-line';
    var yPos = 15 + i * (70 / lineCount) + (Math.random() - 0.5) * 8;
    line.style.top = yPos + '%';
    line.style.animationDelay = (i * 0.06) + 's';
    line.style.background = 'linear-gradient(90deg, transparent, ' + color + ', transparent)';
    line.style.boxShadow = '0 0 6px ' + color;
    track.appendChild(line);
    trackLines.push(line);
  }

  // 生成沿星轨飞行的光点
  var dotColors = isGold ? ['#ffd700','#fff','#f0c060','#ffe8a0'] : ['#00e5ff','#fff','#4ddbff','#80deea'];
  for(var j = 0; j < dotCount; j++){
    (function(idx){
      setTimeout(function(){
        var dot = document.createElement('div');
        dot.className = 'track-dot';
        var size = 3 + Math.random() * 5;
        dot.style.width = size + 'px';
        dot.style.height = size + 'px';
        var yPos = 15 + Math.random() * 70;
        dot.style.top = yPos + '%';
        dot.style.left = '-5%';
        var dx = 110 + Math.random() * 10;
        var dy = (Math.random() - 0.5) * 15;
        dot.style.setProperty('--dx', dx + 'vw');
        dot.style.setProperty('--dy', dy + 'vh');
        dot.style.background = dotColors[Math.floor(Math.random() * dotColors.length)];
        dot.style.boxShadow = '0 0 ' + (size * 3) + 'px ' + dot.style.background;
        dot.style.animationDelay = (Math.random() * 0.2) + 's';
        track.appendChild(dot);
        setTimeout(function(){ dot.remove(); }, 1500);
      }, idx * 60);
    })(j);
  }
}

    avatarEl.innerHTML = '<img src="' + img + '" alt="' + char.name + '" style="width:100%;height:100%;object-fit:cover;object-position:top center" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'" /><span class="emoji-fallback" style="display:none;font-size:5em;position:absolute;top:40%;left:50%;transform:translate(-50%,-50%)">' + char.avatar + '</span>';
  } else if(cone){
    // 光锥：展示光锥图片
    avatarEl.innerHTML = '<img src="' + char.img + '" alt="' + char.name + '" style="width:100%;height:100%;object-fit:contain" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'" /><span class="emoji-fallback" style="display:none;font-size:3em;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%)">cards</span>';
  } else {
    // 无立绘：emoji fallback
    avatarEl.innerHTML = '<span class="emoji-fallback" style="font-size:5em;position:absolute;top:40%;left:50%;transform:translate(-50%,-50%)">' + char.avatar + '</span>';
  }
  avatarEl.style.filter = 'drop-shadow(0 4px 20px rgba(0,0,0,.6))';

  document.getElementById('reveal-name').textContent = char.name;
  var path = PATHS[char.path] || {name:'未知',icon:'?',img:''};
  if(cone){
    document.getElementById('reveal-info').innerHTML = getPathIconHTML(path) + ' ' + path.name;
    document.getElementById('reveal-elem').innerHTML = '';
    document.getElementById('reveal-path').innerHTML = getPathIconHTML(path);
  } else {
    var elem = ELEMENTS[char.element];
    document.getElementById('reveal-info').innerHTML = getElemIconHTML(elem) + ' ' + elem.name + ' ' + getPathIconHTML(path) + ' ' + path.name;
    document.getElementById('reveal-elem').innerHTML = getElemIconHTML(elem);
    document.getElementById('reveal-path').innerHTML = getPathIconHTML(path);
  }
  var starsEl = document.getElementById('reveal-stars');
  starsEl.innerHTML = '';
  for(var i = 0; i < result.rarity; i++){
    var star = document.createElement('span');
    star.className = 'star';
    star.textContent = '\u2B50';
    star.style.animationDelay = (i * 0.1) + 's';
    star.style.color = getRarityColorVar(result.rarity);
    starsEl.appendChild(star);
  }
}

// === 粒子爆发 ===
function createParticleBurst(container, rarity){
  var colors = rarity === 5 ? ['#ffd700','#f0c060','#ffaa00','#fff','#ffe8a0'] : rarity === 4 ? ['#9b6dff','#b388ff','#7c4dff','#fff'] : ['#00e5ff','#4ddbff','#00bcd4','#fff'];
  var count = rarity === 5 ? 60 : rarity === 4 ? 35 : 20;
  for(var i = 0; i < count; i++){
    var p = document.createElement('div');
    p.className = 'particle';
    p.style.background = colors[Math.floor(Math.random() * colors.length)];
    p.style.left = '50%';
    p.style.top = '50%';
    var size = 3 + Math.random() * (rarity === 5 ? 7 : 5);
    p.style.width = size + 'px';
    p.style.height = size + 'px';
    if(rarity === 5){
      p.style.boxShadow = '0 0 ' + (size * 2) + 'px ' + p.style.background;
    }
    var angle = Math.random() * Math.PI * 2;
    var dist = 80 + Math.random() * (rarity === 5 ? 350 : 250);
    p.style.setProperty('--tx', Math.cos(angle) * dist + 'px');
    p.style.setProperty('--ty', Math.sin(angle) * dist + 'px');
    p.style.animationDelay = (Math.random() * 0.3) + 's';
    p.style.animationDuration = (1.2 + Math.random() * 0.8) + 's';
    container.appendChild(p);
    (function(particle){ setTimeout(function(){ particle.remove(); }, 2500); })(p);
  }
}

// === 单抽：星轨穿梭 -> 光爆 -> 立绘显现 ===
function playSingleReveal(result){
  var stage = document.getElementById('gacha-stage');
  var revealCard = document.getElementById('reveal-card');
  var multiGrid = document.getElementById('multi-grid');
  multiGrid.classList.remove('active');
  revealCard.classList.remove('active','five-star','four-star','three-star');

  var isGold = result.rarity === 5;

  // 阶段1：星轨从远处延伸，光点沿星轨飞过
  spawnStarTrack(isGold, isGold ? 20 : 12);

  return sleep(1300).then(function(){
    // 阶段2：星轨尽头光爆开
    triggerWarpFlash(result.rarity);
    if(isGold){
      // 五星：星空裂开
      triggerWarpCrack(result.rarity);
    }
    return sleep(300);
  }).then(function(){
    // 阶段3：品质光柱 + 粒子
    showRarityPillar(result.rarity);
    var burst = document.getElementById('particle-burst');
    if(isGold){
      createParticleBurst(burst, 5);
      return sleep(500).then(function(){
        createParticleBurst(burst, 5);
        return sleep(400);
      });
    }
    return sleep(500);
  }).then(function(){
    // 阶段4：光柱消散，立绘从光中显现
    var pillar = document.getElementById('light-pillar');
    pillar.classList.remove('active');
    showRevealCard(result);
    var burst = document.getElementById('particle-burst');
    if(isGold) createParticleBurst(burst, 5);
    return sleep(600);
  });
}

// === 十连：流星坠落 -> 逐张落地 -> 五星冲击波 ===
function playMultiReveal(results){
  var stage = document.getElementById('gacha-stage');
  var multiGrid = document.getElementById('multi-grid');
  var revealCard = document.getElementById('reveal-card');
  var skipBtn = document.getElementById('skip-btn');
  var nextBtn = document.getElementById('next-btn');
  revealCard.classList.remove('active');
  nextBtn.classList.remove('active');

  var has5 = results.some(function(r){ return r.rarity === 5; });
  var has4 = results.some(function(r){ return r.rarity === 4; });

  // 不排序，按原始顺序
  var sorted = results.slice();

  var chain = Promise.resolve();
  var _skipped = false;
  var _skipResolve = null; // 当前等待中的resolve函数

  // 跳过函数：直接展示全部网格
  function skipToGrid(){
    _skipped = true;
    var rc = document.getElementById('reveal-card');
    rc.classList.remove('active','five-star','four-star','three-star');
    var pillar = document.getElementById('light-pillar');
    if(pillar) pillar.classList.remove('active');
    // 确保所有卡片都已翻开
    var cards = multiGrid.querySelectorAll('.multi-card');
    cards.forEach(function(c){
      if(!c.classList.contains('face-down')){
        c.classList.add('face-down');
      }
    });
    // 隐藏继续按钮
    nextBtn.classList.remove('active');
    // resolve 当前等待中的Promise
    if(_skipResolve){
      var fn = _skipResolve;
      _skipResolve = null;
      fn();
    }
  }

  // 全局跳过按钮
  skipBtn.innerHTML = '跳过 ⏭';
  skipBtn.classList.add('active');
  skipBtn.onclick = function(){
    if(!_skipped){
      skipToGrid();
    }
  };

  // 阶段1：流星从天而降
  chain = chain.then(function(){
    spawnMeteors(results);
    return sleep(1500);
  });

  // 阶段2：最高品质光柱提示
  chain = chain.then(function(){
    if(_skipped) return;
    var maxRarity = has5 ? 5 : has4 ? 4 : 3;
    if(has5){
      triggerWarpCrack(5);
      triggerWarpFlash(5);
    }
    showRarityPillar(maxRarity);
    return sleep(has5 ? 1000 : 700);
  });

  // 阶段3：清理光柱，显示网格
  chain = chain.then(function(){
    if(_skipped) return;
    var pillar = document.getElementById('light-pillar');
    pillar.classList.remove('active');
    var burst2 = document.getElementById('rarity-burst-2');
    if(burst2) burst2.classList.remove('active');
    var rays = document.getElementById('gold-rays');
    if(rays) rays.classList.remove('active');
    multiGrid.innerHTML = '';
    multiGrid.classList.add('active');
    return sleep(200);
  });

  // 阶段4：逐张翻开 + 弹出立绘，点击继续下一张
  sorted.forEach(function(r, idx){
    // 4a: 翻卡
    chain = chain.then(function(){
      if(_skipped) return;
      var card = document.createElement('div');
      card.className = 'multi-card ' + (r.rarity === 5 ? 'five-star' : r.rarity === 4 ? 'four-star' : 'three-star');
      card.style.animationDelay = '0s';
      var mcColor = isLightCone(r.char) ? getItemColor(r.char) : r.char.color;
      var frontBg = 'linear-gradient(180deg, ' + mcColor + '33, ' + mcColor + '11, rgba(0,0,0,0.6))';
      var mcElemHTML = '';
      var mcAvatarHTML = '';
      if(isLightCone(r.char)){
        var mcPath = PATHS[r.char.path] || {name:'未知',icon:'?',img:''};
        mcElemHTML = getPathIconHTML(mcPath);
        mcAvatarHTML = getItemAvatarHTML(r.char);
      } else {
        mcElemHTML = getElemIconHTML(ELEMENTS[r.char.element]);
        mcAvatarHTML = getAvatarHTML(r.char);
      }
      card.innerHTML = '<div class="card-back">\u2726</div>' +
        '<div class="card-front" style="background:' + frontBg + '">' +
        '<div class="mc-elem">' + mcElemHTML + '</div>' +
        '<div class="mc-avatar">' + mcAvatarHTML + '</div>' +
        '<div class="mc-name">' + r.char.name + '</div>' +
        '<div class="mc-stars">' + '\u2B50'.repeat(r.rarity) + '</div>' +
        '</div>';
      if(!isLightCone(r.char)){
        card.onclick = function(){ openInteraction(r.char.id) };
      }

      multiGrid.appendChild(card);
      card.classList.add('face-down');

      var flipDelay = r.rarity === 5 ? 500 : r.rarity === 4 ? 300 : 200;
      return sleep(flipDelay);
    });

    // 4b: 弹出大立绘展示
    chain = chain.then(function(){
      if(_skipped) return;
      var burst = document.getElementById('particle-burst');
      var flash = document.getElementById('flash-overlay');
      var stageEl = document.getElementById('gacha-stage');
      var pillar = document.getElementById('light-pillar');

      if(r.rarity === 5){
        createParticleBurst(burst, 5);
        flash.className = 'flash-overlay flash-gold';
        stageEl.classList.add('screen-shake');
        setTimeout(function(){ stageEl.classList.remove('screen-shake'); }, 400);
        if(pillar) pillar.classList.add('active');
        triggerWarpFlash(5);
      } else if(r.rarity === 4){
        flash.className = 'flash-overlay flash-purple';
        if(pillar) pillar.classList.add('active');
      }

      showRevealCard(r);

      if(r.rarity === 5){
        createParticleBurst(burst, 5);
      }
    });

    // 4c: 等待用户点击“继续查看”或“跳过”
    chain = chain.then(function(){
      if(_skipped) return;
      // 显示“继续查看”按钮
      nextBtn.classList.add('active');
      return new Promise(function(resolve){
        _skipResolve = resolve; // 跳过时可调用
        // 继续查看
        var nextHandler = function(){
          nextBtn.removeEventListener('click', nextHandler);
          nextBtn.classList.remove('active');
          _skipResolve = null;
          resolve();
        };
        nextBtn.addEventListener('click', nextHandler);
      });
    });

    // 4d: 淡出立绘
    chain = chain.then(function(){
      if(_skipped) return;
      var rc = document.getElementById('reveal-card');
      rc.classList.remove('active','five-star','four-star','three-star');
      var pillar = document.getElementById('light-pillar');
      if(pillar) pillar.classList.remove('active');
      return sleep(250);
    });
  });

  // 阶段5：全部翻完，保持十张卡片网格一起展示
  chain = chain.then(function(){
    return sleep(600);
  });

  return chain;
}

// === 动画结束 ===
function finishAnimation(){
  var overlay = document.getElementById('gacha-overlay');
  var skipBtn = document.getElementById('skip-btn');
  var nextBtn = document.getElementById('next-btn');
  var goldField = document.getElementById('gold-starfield');
  var rays = document.getElementById('gold-rays');
  var burst2 = document.getElementById('rarity-burst-2');
  var starTrack = document.getElementById('star-track');
  var meteorLayer = document.getElementById('meteor-layer');
  var warpFlash = document.getElementById('warp-flash');
  var warpBurst = document.getElementById('warp-burst');
  if(goldField){ goldField.classList.remove('active'); goldField.innerHTML = ''; }
  if(rays){ rays.classList.remove('active'); rays.innerHTML = ''; }
  if(burst2) burst2.classList.remove('active');
  if(starTrack){ starTrack.className = 'star-track'; starTrack.innerHTML = ''; }
  if(meteorLayer){ meteorLayer.innerHTML = ''; }
  if(warpFlash){ warpFlash.className = 'warp-flash'; }
  if(warpBurst){ warpBurst.className = 'warp-burst'; warpBurst.innerHTML = ''; }
  // 隐藏继续按钮
  nextBtn.classList.remove('active');
  // skip按钮变为“点击关闭”
  skipBtn.innerHTML = '点击关闭 ✕';
  skipBtn.classList.add('active');
  skipBtn.onclick = function(){
    overlay.classList.remove('active');
    skipBtn.classList.remove('active');
    State.isAnimating = false;
    renderCollection();
  };
  overlay.onclick = function(e){
    if(e.target === overlay){
      overlay.classList.remove('active');
      skipBtn.classList.remove('active');
      State.isAnimating = false;
      renderCollection();
    }
  };
}


// ============================================================
//  角色互动系统
// ============================================================
var ACTION_TYPES = [
  { key:'greet',    label:'打招呼', icon:'👋', anim:'bounce' },
  { key:'battle',   label:'战斗姿态', icon:'⚔️', anim:'shake' },
  { key:'skill',    label:'技能演示', icon:'✨', anim:'zoom' },
  { key:'affinity', label:'好感互动', icon:'💛', anim:'spin' },
];

// 全局：当前互动角色ID
var _interactCharId = null;
var _dragState = { dragging:false, startX:0, rotY:0, moved:false };
var _blinkTimer = null;

// ============================================================
//  Q版2D可动立绘系统
// ============================================================
var ChibiSystem = {
  _model: null,
  _stage: null,
  _fxLayer: null,
  _rotY: 0,
  _elemColor: '#9b6dff',

  // 加载角色到Q版立绘
  loadChar: function(char){
    var stage = document.getElementById('chibi-stage');
    this._stage = stage;
    this._model = document.getElementById('chibi-model');
    this._fxLayer = document.getElementById('chibi-fx');
    if(!this._model) return;

    var elemColor = ELEMENTS[char.element] ? ELEMENTS[char.element].color : char.color;
    this._elemColor = elemColor;

    // 背景光效
    document.getElementById('display-bg').style.background = 'radial-gradient(circle at 50% 35%, ' + char.color + '33, transparent 65%), radial-gradient(circle at 50% 70%, ' + elemColor + '22, transparent 60%)';
    document.getElementById('chibi-aura').style.background = 'radial-gradient(circle, ' + elemColor + ', transparent 55%)';

    // 名牌
    document.getElementById('chibi-nameplate').textContent = char.name;

    // 元素光环
    var ring = document.getElementById('chibi-elem-ring');
    if(ring){
      ring.style.borderColor = elemColor;
      ring.style.boxShadow = '0 0 30px ' + elemColor + '33';
    }

    // 全身立绘图
    var charImg = CHARACTER_IMAGES[char.id];
    var portrait = document.getElementById('chibi-portrait');
    var wrap = document.getElementById('chibi-portrait-wrap');

    if(charImg){
      portrait.src = charImg;
      portrait.classList.remove('emoji-mode');
      portrait.onerror = function(){
        portrait.classList.add('emoji-mode');
        portrait.textContent = char.avatar;
        portrait.removeAttribute('src');
      };
    } else {
      portrait.classList.add('emoji-mode');
      portrait.textContent = char.avatar;
      portrait.removeAttribute('src');
    }

    // 立绘整体投影色
    if(wrap){
      wrap.style.filter = 'drop-shadow(0 4px 20px ' + char.color + '55)';
    }

    // 重置旋转
    this._rotY = 0;
    this._model.style.transform = 'rotateY(0deg)';
    this._model.classList.remove('act-greet','act-battle','act-skill','act-affinity');
    this._model.classList.add('act-idle');
  },

  _startBlink: function(){
    // 立绘模式不需要眨眼（立绘图自带表情）
    if(_blinkTimer) clearInterval(_blinkTimer);
  },

  // 触发动作
  triggerAction: function(actionKey, char){
    if(!this._model) return;
    var model = this._model;
    var elemColor = ELEMENTS[char.element] ? ELEMENTS[char.element].color : char.color;

    // 移除旧动画类
    model.classList.remove('act-idle','act-greet','act-battle','act-skill','act-affinity');
    void model.offsetWidth;
    model.classList.add('act-' + actionKey);

    // 清旧特效
    this.clearFx();

    // 触发特效
    this._spawnFx(actionKey, elemColor);

    // 动画结束后回idle
    var durations = { greet:600, battle:500, skill:800, affinity:1000 };
    var self = this;
    setTimeout(function(){
      model.classList.remove('act-' + actionKey);
      model.classList.add('act-idle');
    }, durations[actionKey] || 600);
  },

  _spawnFx: function(actionKey, color){
    var fx = this._fxLayer;
    if(!fx) return;
    var self = this;

    if(actionKey === 'battle'){
      // 斩击
      var slash = document.createElement('div');
      slash.className = 'chibi-slash';
      slash.style.background = 'linear-gradient(90deg, transparent, ' + color + ', #fff, ' + color + ', transparent)';
      slash.style.boxShadow = '0 0 12px ' + color;
      fx.appendChild(slash);
      setTimeout(function(){ slash.remove(); }, 400);

      // 粒子
      for(var i=0; i<12; i++){
        var p = document.createElement('div');
        p.className = 'chibi-spark';
        p.style.background = color;
        p.style.boxShadow = '0 0 6px ' + color;
        p.style.left = (35 + Math.random()*30) + '%';
        p.style.top = (40 + Math.random()*30) + '%';
        p.style.setProperty('--dx', (Math.random()-0.5)*120 + 'px');
        p.style.setProperty('--dy', -(50+Math.random()*80) + 'px');
        fx.appendChild(p);
        (function(s){ setTimeout(function(){ s.remove(); }, 1500); })(p);
      }
    } else if(actionKey === 'skill'){
      // 能量球
      var orb = document.createElement('div');
      orb.className = 'chibi-orb';
      orb.style.background = 'radial-gradient(circle at 40% 40%, #fff, ' + color + ' 50%, transparent 80%)';
      orb.style.boxShadow = '0 0 20px ' + color + ', 0 0 40px ' + color + '88';
      fx.appendChild(orb);
      setTimeout(function(){ orb.remove(); }, 800);

      // 扩散环
      setTimeout(function(){
        var ring = document.createElement('div');
        ring.className = 'chibi-ring';
        ring.style.borderColor = color;
        ring.style.boxShadow = '0 0 10px ' + color;
        fx.appendChild(ring);
        setTimeout(function(){ ring.remove(); }, 600);
      }, 400);

      // 粒子爆发
      setTimeout(function(){
        for(var i=0; i<20; i++){
          var p = document.createElement('div');
          p.className = 'chibi-spark';
          p.style.background = color;
          p.style.boxShadow = '0 0 8px ' + color;
          p.style.left = (40 + Math.random()*20) + '%';
          p.style.top = (35 + Math.random()*20) + '%';
          var angle = Math.random() * Math.PI * 2;
          var dist = 60 + Math.random()*80;
          p.style.setProperty('--dx', Math.cos(angle)*dist + 'px');
          p.style.setProperty('--dy', Math.sin(angle)*dist + 'px');
          fx.appendChild(p);
          (function(s){ setTimeout(function(){ s.remove(); }, 1800); })(p);
        }
      }, 500);
    } else if(actionKey === 'affinity'){
      // 心形飘升
      for(var i=0; i<15; i++){
        (function(idx){
          setTimeout(function(){
            var h = document.createElement('div');
            h.className = 'chibi-heart';
            h.textContent = ['💗','💕','💖','❤️'][Math.floor(Math.random()*4)];
            h.style.left = (30 + Math.random()*40) + '%';
            h.style.top = (50 + Math.random()*15) + '%';
            h.style.setProperty('--dx', (Math.random()-0.5)*60 + 'px');
            h.style.setProperty('--dy', -(60+Math.random()*40) + 'px');
            fx.appendChild(h);
            setTimeout(function(){ h.remove(); }, 1800);
          }, idx * 80);
        })(i);
      }
    } else if(actionKey === 'greet'){
      // 星光粒子
      for(var i=0; i<10; i++){
        var s = document.createElement('div');
        s.className = 'chibi-spark';
        s.textContent = '✨';
        s.style.background = 'transparent';
        s.style.fontSize = (10+Math.random()*6) + 'px';
        s.style.left = (35 + Math.random()*30) + '%';
        s.style.top = (20 + Math.random()*20) + '%';
        s.style.setProperty('--dx', (Math.random()-0.5)*50 + 'px');
        s.style.setProperty('--dy', -(30+Math.random()*40) + 'px');
        fx.appendChild(s);
        (function(sp){ setTimeout(function(){ sp.remove(); }, 1500); })(s);
      }
    }
  },

  clearFx: function(){
    if(this._fxLayer) this._fxLayer.innerHTML = '';
  },

  // 拖拽旋转
  setupControls: function(){
    var model = this._model;
    var display = document.getElementById('char-display');
    if(!model || !display) return;
    var self = this;

    function onDown(x){
      _dragState.dragging = true;
      _dragState.startX = x;
      _dragState.rotY = self._rotY;
      _dragState.moved = false;
      model.classList.add('dragging');
    }
    function onMove(x){
      if(!_dragState.dragging) return;
      var dx = x - _dragState.startX;
      if(Math.abs(dx) > 5) _dragState.moved = true;
      self._rotY = _dragState.rotY + dx * 0.5;
      if(self._rotY > 50) self._rotY = 50;
      if(self._rotY < -50) self._rotY = -50;
      model.style.transform = 'rotateY(' + self._rotY + 'deg)';
    }
    function onUp(){
      if(!_dragState.dragging) return;
      _dragState.dragging = false;
      model.classList.remove('dragging');
    }

    display.addEventListener('mousedown', function(e){ onDown(e.clientX); e.preventDefault(); });
    document.addEventListener('mousemove', function(e){ onMove(e.clientX); });
    document.addEventListener('mouseup', onUp);

    display.addEventListener('touchstart', function(e){ var t=e.touches[0]; onDown(t.clientX); }, {passive:true});
    document.addEventListener('touchmove', function(e){
      if(_dragState.dragging){ var t=e.touches[0]; onMove(t.clientX); e.preventDefault(); }
    }, {passive:false});
    document.addEventListener('touchend', onUp);

    // 鼠标悬停跟随
    display.addEventListener('mousemove', function(e){
      if(_dragState.dragging) return;
      var rect = display.getBoundingClientRect();
      var cx = (e.clientX - rect.left) / rect.width - 0.5;
      self._rotY = cx * 20;
      model.style.transform = 'rotateY(' + self._rotY + 'deg)';
    });
    display.addEventListener('mouseleave', function(){
      if(!_dragState.dragging){
        self._rotY = 0;
        model.style.transform = 'rotateY(0deg)';
      }
    });
  },

  wasClick: function(){ return !_dragState.moved; }
};

// ============================================================
//  角色互动系统（对接 ChibiSystem）
// ============================================================
function openInteraction(charId){
  var char = getActiveChar(charId);
  if(!char) return;
  var collectId = resolveCollectId(charId);
  if(!State.collection[collectId]) return;
  _interactCharId = charId;

  var panel = document.getElementById('interaction-panel');
  document.getElementById('inter-title').textContent = char.name + ' · 互动';

  // 加载Q版立绘
  ChibiSystem.loadChar(char);
  ChibiSystem.setupControls();

  renderCostumeBar(charId);
  updateAffinity(collectId);

  var btnContainer = document.getElementById('action-buttons');
  btnContainer.innerHTML = '';
  ACTION_TYPES.forEach(function(act){
    var btn = document.createElement('button');
    btn.className = 'action-btn';
    btn.innerHTML = '<div class="ab-icon">' + act.icon + '</div>' + act.label;
    btn.onclick = function(){ triggerAction(charId, act); };
    btnContainer.appendChild(btn);
  });

  panel.classList.add('active');
  setTimeout(function(){ triggerAction(charId, ACTION_TYPES[0]); }, 400);
}

function triggerAction(charId, action){
  var char = getActiveChar(charId);
  var collectId = resolveCollectId(charId);
  if(!char) return;

  var display = document.getElementById('char-display');
  var bubble = document.getElementById('dialogue-bubble');

  // Q版动画 + 特效
  ChibiSystem.triggerAction(action.key, char);

  // 屏幕震动（战斗/技能）
  if(action.key === 'battle' || action.key === 'skill'){
    display.classList.remove('shake');
    void display.offsetWidth;
    display.classList.add('shake');
    setTimeout(function(){ display.classList.remove('shake'); }, 500);
  }

  // 台词
  var lines = char.dialogues[action.key];
  var line = lines[Math.floor(Math.random() * lines.length)];
  bubble.textContent = line;
  bubble.classList.remove('show');
  void bubble.offsetWidth;
  bubble.classList.add('show');

  // 好感度
  var gains = { greet:1, battle:2, skill:3, affinity:5 };
  State.collection[collectId].affinity = Math.min(100, (State.collection[collectId].affinity || 0) + gains[action.key]);
  updateAffinity(collectId);

  setTimeout(function(){ bubble.classList.remove('show'); }, 3500);
}
function updateAffinity(charId){
  var cid = resolveCollectId(charId);
  var aff = (State.collection[cid] && State.collection[cid].affinity) || 0;
  document.getElementById('affinity-fill').style.width = aff + '%';
  document.getElementById('affinity-num').textContent = aff;
}

// ============================================================
//  图鉴渲染
// ============================================================
function renderCollection(){
  var grid = document.getElementById('collection-grid');
  grid.innerHTML = '';
  var filter = State.currentFilter;

  if(State.poolType === 'cone'){
    // 光锥图鉴
    LIGHT_CONES.forEach(function(cone){
      var owned = State.coneCollection[cone.id];
      var show = false;
      if(filter === 'all') show = true;
      else if(filter === 'owned') show = !!owned;
      else if(filter === '5') show = cone.rarity === 5;
      else if(filter === '4') show = cone.rarity === 4 || cone.rarity === 3;
      if(!show) return;

      var color = getItemColor(cone);
      var card = document.createElement('div');
      card.className = 'coll-card ' + (cone.rarity === 5 ? 'five-star' : cone.rarity === 4 ? 'four-star' : 'three-star') + (!owned ? ' locked' : '');
      card.style.background = 'linear-gradient(180deg, ' + color + '22, ' + color + '08, rgba(0,0,0,0.5))';
      var path = PATHS[cone.path] || {name:'未知',icon:'?',img:''};

      if(owned){
        card.innerHTML = '<div class="cc-elem">' + getPathIconHTML(path) + '</div><div class="cc-avatar">' + getItemAvatarHTML(cone) + '</div><div class="cc-name">' + cone.name + '</div>' + (owned.count > 1 ? '<div class="cc-count">x' + owned.count + '</div>' : '') + (owned.isNew ? '<div class="cc-new">NEW</div>' : '');
      } else {
        card.innerHTML = '<div class="cc-elem">?</div><div class="cc-avatar">🔒</div><div class="cc-name">???</div>';
      }
      grid.appendChild(card);
    });
  } else {
    // 角色图鉴
    CHARACTERS.forEach(function(char){
      if(VARIANTS[char.id]) return;
      var owned = State.collection[char.id];
      var show = false;
      if(filter === 'all') show = true;
      else if(filter === 'owned') show = !!owned;
      else if(filter === '5') show = char.rarity === 5;
      else if(filter === '4') show = char.rarity === 4;
      if(!show) return;

      var hasCostume = false;
      if(owned && owned.unlockedForms){
        var formCount = 0;
        for(var fid in owned.unlockedForms){ if(owned.unlockedForms[fid]) formCount++; }
        hasCostume = formCount > 1;
      }

      var card = document.createElement('div');
      card.className = 'coll-card ' + (char.rarity === 5 ? 'five-star' : 'four-star') + (!owned ? ' locked' : '');
      card.style.background = 'radial-gradient(ellipse at 50% 30%, ' + char.color + '33, ' + char.color + '11 60%, rgba(0,0,0,0.6))';

      if(owned){
        card.innerHTML = '<div class="cc-elem">' + getElemIconHTML(ELEMENTS[char.element]) + '</div><div class="cc-avatar">' + getAvatarHTML(char) + '</div><div class="cc-name">' + char.name + '</div>' + (owned.count > 1 ? '<div class="cc-count">x' + owned.count + '</div>' : '') + (owned.isNew ? '<div class="cc-new">NEW</div>' : '') + (hasCostume ? '<div class="cc-costume">' + formCount + '形态</div>' : '');
        card.onclick = function(){
          owned.isNew = false;
          openInteraction(char.id);
          renderCollection();
        };
      } else {
        card.innerHTML = '<div class="cc-elem">?</div><div class="cc-avatar">🔒</div><div class="cc-name">???</div>';
      }
      grid.appendChild(card);
    });
  }
}

function updateStats(){
  var tickets = State.tickets;
  var ticketText = tickets === Infinity ? '∞' : tickets.toLocaleString();
  document.getElementById('stat-tickets').textContent = ticketText;
  document.getElementById('stat-pulls').textContent = State.totalPulls;
  document.getElementById('stat-5star').textContent = State.fiveStarCount;
  document.getElementById('stat-4star').textContent = State.fourStarCount;
  document.getElementById('stat-starlight').textContent = State.starlight.toLocaleString();
  document.getElementById('pity-5-num').textContent = State.pity5 + '/90';
  document.getElementById('pity-5-fill').style.width = (State.pity5/90*100) + '%';
  document.getElementById('pity-4-num').textContent = State.pity4 + '/10';
  document.getElementById('pity-4-fill').style.width = (State.pity4/10*100) + '%';
  var hasTickets = tickets === Infinity || tickets >= 1;
  var hasTenTickets = tickets === Infinity || tickets >= 10;

  document.getElementById('btn-pull-10').disabled = !hasTenTickets;

function showTicketInput(){
  var overlay = document.getElementById('ticket-input-overlay');
  var input = document.getElementById('ticket-input');
  input.value = State.tickets === Infinity ? '999999' : State.tickets;
  overlay.style.display = 'flex';
  input.focus();
  input.select();
}

function confirmTicketInput(){
  var input = document.getElementById('ticket-input');
  var val = input.value.trim();
  if(val === 'Infinity' || val === '∞' || val === '-1'){
    State.tickets = Infinity;
  } else {
    var num = parseInt(val, 10);
    if(isNaN(num) || num < 0) num = 0;
    State.tickets = num;
  }
  document.getElementById('ticket-input-overlay').style.display = 'none';
  updateStats();
  showToast('星轨票已设置为：' + (State.tickets === Infinity ? '无限' : State.tickets.toLocaleString()));
}

function showToast(msg){
  var toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(function(){ toast.classList.remove('show'); }, 3000);
}

// 星芒兑换星轨票
function showExchange(){
  if(State.starlight < 20){
    showToast('星芒不足！至少需要20星芒才能兑换1张星轨票');
    return;
  }
  var overlay = document.getElementById('exchange-overlay');
  document.getElementById('exchange-starlight-num').textContent = State.starlight.toLocaleString();
  var maxExchange = Math.floor(State.starlight / 20);
  var input = document.getElementById('exchange-input');
  input.value = 1;
  input.max = maxExchange;
  document.getElementById('exchange-preview').textContent = '1';
  overlay.style.display = 'flex';
  input.focus();
  input.select();
}

function confirmExchange(){
  var input = document.getElementById('exchange-input');
  var num = parseInt(input.value, 10);
  if(isNaN(num) || num < 1){
    showToast('请输入有效的兑换数量');
    return;
  }
  var cost = num * 20;
  if(cost > State.starlight){
    showToast('星芒不足！需要' + cost + '星芒，当前仅有' + State.starlight + '星芒');
    return;
  }
  State.starlight -= cost;
  State.tickets = (State.tickets === Infinity) ? Infinity : State.tickets + num;
  document.getElementById('exchange-overlay').style.display = 'none';
  updateStats();
  showToast('兑换成功！消耗' + cost + '星芒，获得' + num + '张星轨票');
}
