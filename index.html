// ============================================================
//  初始化
// ============================================================
function init(){
  initStarfield();
  document.getElementById('btn-pull-1').onclick = function(){ doPull(1); };
  document.getElementById('btn-pull-10').onclick = function(){ doPull(10); };
  document.getElementById('inter-close').onclick = function(){
    document.getElementById('interaction-panel').classList.remove('active');
  };
  document.getElementById('interaction-panel').onclick = function(e){
    if(e.target.id === 'interaction-panel'){
      document.getElementById('interaction-panel').classList.remove('active');
    }
  };

  // === 点击角色3D模型触发随机互动 ===
  var charDisplay = document.getElementById('char-display');
  charDisplay.addEventListener('mouseup', function(){
    if(ChibiSystem.wasClick() && _interactCharId){
      var char = getActiveChar(_interactCharId);
      if(char){
        var actions = ['greet','battle','skill','affinity'];
        var randomAct = actions[Math.floor(Math.random()*actions.length)];
        var actDef = ACTION_TYPES.find(function(a){return a.key===randomAct});
        if(actDef) triggerAction(_interactCharId, actDef);
      }
    }
  });
  charDisplay.addEventListener('touchend', function(){
    if(ChibiSystem.wasClick() && _interactCharId){
      var char = getActiveChar(_interactCharId);
      if(char){
        var actions = ['greet','battle','skill','affinity'];
        var randomAct = actions[Math.floor(Math.random()*actions.length)];
        var actDef = ACTION_TYPES.find(function(a){return a.key===randomAct});
        if(actDef) triggerAction(_interactCharId, actDef);
      }
    }
  });
  document.getElementById('btn-select-up').onclick = openUpSelector;
  document.getElementById('up-selector-close').onclick = function(){
    document.getElementById('up-selector-overlay').style.display = 'none';
  };
  document.getElementById('up-selector-overlay').onclick = function(e){
    if(e.target.id === 'up-selector-overlay'){
      e.target.style.display = 'none';
    }
  };
  // 星轨票设置
  document.getElementById('stat-tickets').onclick = showTicketInput;
  document.getElementById('btn-set-tickets').onclick = function(e){ e.stopPropagation(); showTicketInput(); };
  document.getElementById('ticket-confirm').onclick = confirmTicketInput;
  document.getElementById('ticket-cancel').onclick = function(){
    document.getElementById('ticket-input-overlay').style.display = 'none';
  };
  document.getElementById('ticket-input').addEventListener('keydown', function(e){
    if(e.key === 'Enter') confirmTicketInput();
    if(e.key === 'Escape') document.getElementById('ticket-input-overlay').style.display = 'none';
  });
  document.getElementById('ticket-input-overlay').onclick = function(e){
    if(e.target.id === 'ticket-input-overlay') e.target.style.display = 'none';
  };
  // 星芒兑换
  document.getElementById('stat-starlight').onclick = showExchange;
  document.getElementById('btn-exchange').onclick = function(e){ e.stopPropagation(); showExchange(); };
  document.getElementById('exchange-confirm').onclick = confirmExchange;
  document.getElementById('exchange-cancel').onclick = function(){
    document.getElementById('exchange-overlay').style.display = 'none';
  };
  document.getElementById('exchange-input').addEventListener('input', function(){
    var num = parseInt(this.value, 10) || 0;
    document.getElementById('exchange-preview').textContent = num;
  });
  document.getElementById('exchange-input').addEventListener('keydown', function(e){
    if(e.key === 'Enter') confirmExchange();
    if(e.key === 'Escape') document.getElementById('exchange-overlay').style.display = 'none';
  });
  document.getElementById('exchange-overlay').onclick = function(e){
    if(e.target.id === 'exchange-overlay') e.target.style.display = 'none';
  };
  var exchangePresets = document.querySelectorAll('.exchange-preset');
  exchangePresets.forEach(function(btn){
    btn.onclick = function(){
      var val = parseInt(btn.dataset.val, 10);
      var maxEx = Math.floor(State.starlight / 20);
      if(val > maxEx){
        showToast('星芒不足，最多可兑换' + maxEx + '张');
        document.getElementById('exchange-input').value = maxEx;
        document.getElementById('exchange-preview').textContent = maxEx;
      } else {
        document.getElementById('exchange-input').value = val;
        document.getElementById('exchange-preview').textContent = val;
      }
    };
  });
  var presetBtns = document.querySelectorAll('.preset-btn');
  presetBtns.forEach(function(btn){
    btn.onclick = function(){
      var val = btn.dataset.val;
      var input = document.getElementById('ticket-input');
      if(val === 'Infinity'){
        input.value = 'Infinity';
      } else {
        input.value = val;
      }
    };
  });
  var tabs = document.querySelectorAll('.filter-tab');
  tabs.forEach(function(tab){
    tab.onclick = function(){
      tabs.forEach(function(t){ t.classList.remove('active'); });
      tab.classList.add('active');
      State.currentFilter = tab.dataset.filter;
      renderCollection();
    };
  });
  // 卡池切换
  var poolTabs = document.querySelectorAll('.pool-tab');
  poolTabs.forEach(function(tab){
    tab.onclick = function(){
      poolTabs.forEach(function(t){ t.classList.remove('active'); });
      tab.classList.add('active');
      State.poolType = tab.dataset.pool;
      State.guaranteed5 = false;
      updateBannerInfo();
      renderCollection();
      showToast(State.poolType === 'cone' ? '已切换至光锥池' : '已切换至角色池');
    };
  });
  updateStats();
  renderCollection();
  updateBannerInfo();
  showToast('欢迎来到星穹跃迁系统！点击"选择UP"自定义角色，点击星轨票数量可修改');
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
